<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Transparent centre, slide-coloured corners and a hairline edge. Laid over each clip so GIFs get rounded corners. */
  html, body { margin: 0; width: 1216px; height: 760px; background: transparent; overflow: hidden; }
  div { position: absolute; inset: 0; border-radius: 22px; box-shadow: 0 0 0 80px #0d0e12, inset 0 0 0 1.5px rgba(255, 255, 255, 0.16); }
</style>
</head>
<body><div></div></body>
</html>
